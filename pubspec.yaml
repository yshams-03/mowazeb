name: ummah_pulse
description: A smart lifestyle and habit app for busy Muslims.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  cloud_functions: ^5.3.4
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+4
  google_sign_in: ^6.3.0
  adhan: ^2.0.0
  geolocator: ^13.0.4
  geocoding: ^4.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_dotenv: ^5.2.1
  http: ^1.4.0
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  go_router: ^14.8.1
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  hijri: ^3.0.0
  timezone: ^0.10.0
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.3
  flutter_qiblah: ^3.1.0+1
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  geolocator_platform_interface: ^4.2.4
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  mockito: ^5.4.5
  firebase_auth_mocks: ^0.14.1
  fake_cloud_firestore: ^3.1.0
  firebase_core_platform_interface: ^6.0.3
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: '#0F1419'
  adaptive_icon_foreground: assets/app_icon.png

flutter_native_splash:
  color: '#0F1419'
  image: assets/app_icon.png
  android_12:
    color: '#0F1419'
    image: assets/app_icon.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/app_icon.png
